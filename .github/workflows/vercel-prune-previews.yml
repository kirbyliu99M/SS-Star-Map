# Vercel preview 只留最新一個（AGENTS.md §9.2）。
# 需要：secrets.VERCEL_TOKEN；vars.VERCEL_PROJECT_ID、vars.VERCEL_TEAM_SLUG。
# vars.VERCEL_PRUNE 設成 1 才會真的刪，否則只列出。
name: vercel-prune-previews

on: deployment_status

concurrency:
  group: vercel-prune-previews
  cancel-in-progress: true

jobs:
  prune:
    if: github.event.deployment_status.state == 'success' && contains(github.event.deployment.environment, 'Preview')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: node scripts/vercel-prune-previews.mjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_SLUG: ${{ vars.VERCEL_TEAM_SLUG }}
          PRUNE: ${{ vars.VERCEL_PRUNE }}
